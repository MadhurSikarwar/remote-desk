[package]
name = "rc-desktop"
description = "Remote Desk desktop application"
version.workspace = true
edition.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
directories.workspace = true
rc-capture = { path = "../../crates/rc-capture" }
rc-clipboard = { path = "../../crates/rc-clipboard" }
rc-codec = { path = "../../crates/rc-codec" }
rc-core = { path = "../../crates/rc-core" }
rc-crypto = { path = "../../crates/rc-crypto" }
rc-input = { path = "../../crates/rc-input" }
rc-net = { path = "../../crates/rc-net" }
rc-protocol = { path = "../../crates/rc-protocol" }
rc-rendezvous = { path = "../../crates/rc-rendezvous" }
serde.workspace = true
sha2 = "0.10"
tauri.workspace = true
tracing.workspace = true

[dev-dependencies]
rc-server = { path = "../server" }
tokio.workspace = true
serde_json = "1"
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
