[package]
name = "rc-desktop"
description = "Remote Control desktop application"
version.workspace = true
edition.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
rc-capture = { path = "../../crates/rc-capture" }
rc-codec = { path = "../../crates/rc-codec" }
rc-core = { path = "../../crates/rc-core" }
rc-input = { path = "../../crates/rc-input" }
rc-protocol = { path = "../../crates/rc-protocol" }
serde.workspace = true
tauri.workspace = true
tracing.workspace = true

[dev-dependencies]
serde_json = "1"
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
