# docker compose -f deploy/compose.yaml up -d --build
# docker compose -f deploy/compose.yaml logs rc-server     (shows the key fingerprint)

services:
  rc-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: rc-server:local
    restart: unless-stopped
    ports:
      - "21117:21117"
    volumes:
      - rc-server-data:/data
    environment:
      RC_LOG: info
    # The server needs nothing beyond its port and its data folder.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  rc-server-data:
